<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<title>বাকির খাতা</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1b2a1f;--mut:#667;--bd:#dfe3dc;--g:#1f7a4d;--r:#c0392b;--b:#2456a6}
@media(prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d241f;--tx:#e8eee9;--mut:#9aa69d;--bd:#2d372f;--g:#4cc38a;--r:#ff7b6b;--b:#5b8fe0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif;font-size:16px}
.w{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.sum .big{grid-column:1/3;text-align:center}
.sum small{color:var(--mut);display:block;font-size:13px}
.sum b{font-size:20px}.big b{font-size:26px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on.buy{background:var(--r);color:#fff;border-color:var(--r)}
.tabs button.on.pay{background:var(--g);color:#fff;border-color:var(--g)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
textarea{min-height:130px;font-size:13px}
.go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--b);color:#fff;font-size:16px;font-weight:600}
.go:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
.t{font-weight:600}.s{font-size:12.5px;color:var(--mut)}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.amt.buy{color:var(--r)}.amt.pay{color:var(--g)}
.x{background:none;border:0;color:var(--mut);font-size:12px;padding:2px 0}
.gear{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:10px;padding:6px 10px;font-size:13px}
.mh{font-size:14px;color:var(--mut);padding:6px 0 2px}
.msg{padding:14px;text-align:center;color:var(--mut)}
.err{color:var(--r);font-size:14px;margin-top:8px}
#mf{margin-bottom:10px;background:var(--card)}
#qlist{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.qi{border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--bg)}
.qi.on{border-color:var(--r);grid-column:1/3}
.qc{display:flex;align-items:center;gap:8px;margin:0;color:var(--tx);font-size:15px}
.qc input{width:22px;height:22px;padding:0;flex:none}
.qp{margin-top:6px;padding:8px}
.qx{float:right;background:none;border:0;color:var(--r);font-size:16px}
.qadd{display:flex;gap:6px;margin-top:8px}
.qadd button,.lnk{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;white-space:nowrap}
.lnk{margin-top:8px;color:var(--mut);font-size:13px}
.tot{font-size:18px;font-weight:700;text-align:right;margin-top:10px;color:var(--r)}
[hidden]{display:none!important}
.mrow{display:flex;gap:8px;margin-bottom:10px}
.mrow #mf{margin-bottom:0;flex:1}
.rbtn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:15px;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:6px}
.ab{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:5px 10px;font-size:13px}
.ab.del{color:var(--r);border-color:var(--r)}
#ed{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;overflow:auto;padding:14px}
.edbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;max-width:560px;margin:20px auto}
.edbtn{display:flex;gap:8px;margin-top:12px}
.edbtn button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.edbtn .pri{background:var(--b);color:#fff;border-color:var(--b);font-weight:600}
.edbtn .dng{color:var(--r);border-color:var(--r)}
#rep{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:14px}
#rep .in{max-width:640px;margin:0 auto}
#rep h2{margin:6px 0 2px;font-size:19px}
.rbar{display:flex;gap:8px;margin:10px 0}
.rbar select{flex:1}
.rbar button{border:0;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;background:var(--b);color:#fff}
.rbar button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.hint{font-size:12.5px;color:var(--mut);margin-bottom:10px}
table.rt{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.rt th,.rt td{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left;vertical-align:top}
.rt td.n,.rt th.n{text-align:right;white-space:nowrap}
.rt tfoot td{font-weight:700;border-top:2px solid var(--tx)}
.rsum{margin-top:10px;font-size:15px}
.rsum div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd)}
.rsum .fin{font-weight:700;font-size:17px}
@media print{
 :root{--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--bd:#bbb;--g:#14683f;--r:#a82e1f}
 body{background:#fff}
 .w,#ed{display:none!important}
 #rep{position:static;overflow:visible;padding:0}
 .noprint{display:none!important}
}
</style>
</head>
<body>
<div class="w">
<div class="top"><h1>📒 বাকির খাতা</h1><button class="gear" id="gear" hidden>⚙ সেটিং</button></div>

<div id="setup" class="card" hidden>
  <b>প্রথমবার সেটআপ</b>
  <label>আপনার নাম (যেমন: রহিম / দোকানদার)</label><input id="sName">
  <label>খাতার গোপন কোড (দুজনের একই কোড দিতে হবে, কমপক্ষে ৮ অক্ষর, ইংরেজিতে)</label><input id="sCode" placeholder="যেমন: rahim-store-7391" autocapitalize="off">
  <label>Firebase কনফিগ (Firebase থেকে কপি করা লেখা এখানে পেস্ট করুন)</label><textarea id="sCfg" placeholder='const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." };'></textarea>
  <div id="sErr" class="err"></div>
  <button class="go" id="sSave">চালু করুন</button>
</div>

<div id="status" class="msg" hidden>লোড হচ্ছে…</div>

<div id="app" hidden>
  <div class="sum">
    <div class="big"><small>এখন মোট বাকি</small><b id="due">০</b></div>
    <div><small>মোট কেনা</small><b id="tb" style="color:var(--r)">০</b></div>
    <div><small>মোট জমা</small><b id="tp" style="color:var(--g)">০</b></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="tabs">
      <button id="tb1" class="buy on">🛒 কেনা (বাকি)</button>
      <button id="tb2" class="pay">💰 টাকা জমা</button>
    </div>
    <label>তারিখ</label><input id="d" type="date">
    <div id="quick">
      <label>জিনিস বেছে নিন, তারপর দাম লিখুন</label>
      <div id="qlist"></div>
      <div class="qadd"><input id="newItem" placeholder="তালিকায় নতুন আইটেম যোগ করুন"><button id="addItem">➕ যোগ</button></div>
      <button class="lnk" id="editBtn">✏ তালিকা সম্পাদনা (মুছুন)</button>
    </div>
    <label id="il">কী কিনলেন (জিনিসের নাম)</label><input id="item">
    <label id="al">টাকা</label><input id="amt" type="number" inputmode="decimal" min="0" placeholder="০">
    <div class="tot" id="total"></div>
    <label>নোট (ঐচ্ছিক)</label><input id="note">
    <button class="go" id="save">সংরক্ষণ করুন</button>
  </div>
  <div class="mrow"><select id="mf"></select><button class="rbtn" id="repBtn">📄 রিপোর্ট</button></div>
  <div id="ms" class="sum" style="margin-bottom:10px"></div>
  <div class="card" id="list"></div>
</div>
</div>

<div id="ed" hidden><div class="edbox">
  <b id="eT">এন্ট্রি সম্পাদনা</b>
  <label>তারিখ</label><input id="eD" type="date">
  <label>জিনিস / বিবরণ</label><input id="eI">
  <label>টাকা</label><input id="eA" type="number" inputmode="decimal" min="0">
  <label>নোট</label><input id="eN">
  <div class="edbtn"><button class="pri" id="eS">সংরক্ষণ</button><button id="eC">বাতিল</button></div>
  <div class="edbtn"><button class="dng" id="eX">🗑 এই এন্ট্রি মুছুন</button></div>
</div></div>

<div id="rep" hidden><div class="in">
  <div class="rbar noprint"><select id="rm"></select><button id="rPrint">🖨 প্রিন্ট / PDF</button><button class="sec" id="rClose">✕</button></div>
  <div class="hint noprint">PDF করতে "প্রিন্ট / PDF" চাপুন, তারপর প্রিন্টার তালিকা থেকে <b>Save as PDF</b> (PDF হিসেবে সেভ করুন) বেছে নিন।</div>
  <div id="repBody"></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ঐচ্ছিক: কনফিগ সরাসরি এখানে বসিয়ে দিলে সেটআপ স্ক্রিনে আর পেস্ট করতে হবে না।
const BUILT_IN_CONFIG = {
  apiKey: "AIzaSyDFDyswAxACdXOr0CYKPk6_ZJ_TjZb-Fsg",
  authDomain: "bakir-khata-b7a0a.firebaseapp.com",
  projectId: "bakir-khata-b7a0a",
  storageBucket: "bakir-khata-b7a0a.firebasestorage.app",
  messagingSenderId: "271195103926",
  appId: "1:271195103926:web:ea7ffcb14431637f1bfc17"
};
if(BUILT_IN_CONFIG){const c=document.getElementById('sCfg');c.hidden=true;c.previousElementSibling.hidden=true}

const bn=n=>Number(n||0).toLocaleString('bn-BD');
const tk=n=>'৳ '+bn(n);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let type='buy',rows=[],filter='all',col=null,unsub=null,myName='';

function parseCfg(t){
  const c={};
  ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(k=>{
    const m=t.match(new RegExp(k+'\\s*:\\s*["\']([^"\']+)["\']'));if(m)c[k]=m[1];
  });
  return c;
}
function showSetup(){
  $('app').hidden=true;$('status').hidden=true;$('setup').hidden=false;
  $('sName').value=LS.get('kh_name')||'';$('sCode').value=LS.get('kh_code')||'';
  $('sCfg').value=LS.get('kh_cfg')?'(আগের কনফিগ সংরক্ষিত আছে — বদলাতে চাইলে নতুন করে পেস্ট করুন)':'';
}
$('gear').onclick=showSetup;
$('sSave').onclick=()=>{
  const name=$('sName').value.trim(),code=$('sCode').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
  let cfgText=$('sCfg').value.trim();
  if(!name){$('sErr').textContent='নাম লিখুন';return}
  if(code.length<8){$('sErr').textContent='গোপন কোড ইংরেজি অক্ষর/সংখ্যায় কমপক্ষে ৮ অক্ষরের হতে হবে';return}
  let cfg=null;
  if(BUILT_IN_CONFIG)cfg=BUILT_IN_CONFIG;
  else if(cfgText.startsWith('(')&&LS.get('kh_cfg'))cfg=JSON.parse(LS.get('kh_cfg'));
  else cfg=parseCfg(cfgText);
  if(!cfg||!cfg.apiKey||!cfg.projectId){$('sErr').textContent='কনফিগ ঠিকমতো পাওয়া যায়নি। apiKey ও projectId সহ পুরো লেখাটা পেস্ট করুন';return}
  LS.set('kh_name',name);LS.set('kh_code',code);LS.set('kh_cfg',JSON.stringify(cfg));
  location.reload();
};

function setType(t){type=t;$('tb1').classList.toggle('on',t==='buy');$('tb2').classList.toggle('on',t==='pay');
  $('quick').hidden=t!=='buy';
  $('il').textContent=t==='buy'?'অন্য জিনিস (তালিকায় না থাকলে)':'কীভাবে জমা (ঐচ্ছিক)';
  $('al').textContent=t==='buy'?'অন্য জিনিসের দাম':'টাকা';
  $('item').placeholder=t==='buy'?'যেমন: চাল ২ কেজি':'যেমন: নগদ / বিকাশ';
  calcTotal()}
const DEFAULT_ITEMS=['চাল','ডাল','তেল','লবণ','বিস্কুট','ভাজা','সিগারেট','ব্যঞ্জন','লাকি','ইস্টার','চিপস','হুইল পাউডার','গ্রিন পাউডার','গরম মশলা','জিরা','মাংসের মশলা','ঝালের গুঁড়া'];
let items=(()=>{try{const a=JSON.parse(LS.get('kh_items'));if(Array.isArray(a)&&a.length)return a}catch(e){}return DEFAULT_ITEMS.slice()})();
let sel={},editList=false;
const saveItems=()=>LS.set('kh_items',JSON.stringify(items));
function calcTotal(){
  if(type!=='buy'){$('total').textContent='';return}
  let t=parseFloat($('amt').value)||0;
  for(const k in sel)t+=parseFloat(sel[k])||0;
  $('total').textContent=t>0?'মোট: '+tk(t):'';
}
function renderQuick(){
  $('qlist').innerHTML=items.map((n,i)=>{const on=n in sel;
    return `<div class="qi${on?' on':''}"><label class="qc"><input type="checkbox" data-i="${i}"${on?' checked':''}><span>${esc(n)}</span>${editList?`<button class="qx" data-r="${i}">✕</button>`:''}</label>${on?`<input class="qp" type="number" inputmode="decimal" min="0" placeholder="দাম (টাকা)" data-p="${i}" value="${esc(sel[n])}">`:''}</div>`}).join('');
  $('editBtn').textContent=editList?'✔ সম্পাদনা শেষ':'✏ তালিকা সম্পাদনা (মুছুন)';
}
$('qlist').onchange=e=>{
  const i=e.target.dataset.i;if(i===undefined)return;
  const n=items[i];
  if(e.target.checked)sel[n]='';else delete sel[n];
  renderQuick();calcTotal();
  if(e.target.checked){const p=document.querySelector('[data-p="'+i+'"]');if(p)p.focus()}
};
$('qlist').oninput=e=>{
  const i=e.target.dataset.p;if(i===undefined)return;
  sel[items[i]]=e.target.value;calcTotal();
};
$('qlist').onclick=e=>{
  const r=e.target.dataset.r;if(r===undefined)return;
  e.preventDefault();
  const n=items[r];
  if(!confirm('"'+n+'" তালিকা থেকে সরাবেন?'))return;
  items.splice(r,1);delete sel[n];saveItems();renderQuick();calcTotal();
};
$('addItem').onclick=()=>{
  const n=$('newItem').value.trim();if(!n)return;
  if(!items.includes(n)){items.push(n);saveItems()}
  $('newItem').value='';renderQuick();
};
$('editBtn').onclick=()=>{editList=!editList;renderQuick()};
$('amt').oninput=calcTotal;
$('tb1').onclick=()=>setType('buy');$('tb2').onclick=()=>setType('pay');
const monthName=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('bn-BD',{month:'long',year:'numeric'})};

function render(){
  const sum=t=>rows.filter(r=>r.type===t).reduce((a,r)=>a+(+r.amount||0),0);
  const buy=sum('buy'),pay=sum('pay');
  $('due').textContent=tk(buy-pay);$('tb').textContent=tk(buy);$('tp').textContent=tk(pay);
  const months=[...new Set(rows.map(r=>(r.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const sel=$('mf');
  sel.innerHTML='<option value="all">সব মাস</option>'+months.map(m=>`<option value="${m}">${monthName(m)}</option>`).join('');
  if(!months.includes(filter))filter='all';sel.value=filter;
  const vis=rows.filter(r=>filter==='all'||(r.date||'').startsWith(filter));
  const vs=t=>vis.filter(r=>r.type===t).reduce((a,r)=>a+(+r.amount||0),0);
  $('ms').innerHTML=filter==='all'?'':`<div><small>এ মাসে কেনা</small><b style="color:var(--r)">${tk(vs('buy'))}</b></div><div><small>এ মাসে জমা</small><b style="color:var(--g)">${tk(vs('pay'))}</b></div>`;
  if(!vis.length){$('list').innerHTML='<div class="msg">এখনো কোনো এন্ট্রি নেই</div>';return}
  let h='',last='';
  vis.forEach(r=>{
    const m=(r.date||'').slice(0,7);
    if(m!==last){last=m;h+=`<div class="mh"><b>${monthName(m)}</b></div>`}
    const dt=new Date(r.date).toLocaleDateString('bn-BD',{day:'numeric',month:'short'});
    h+=`<div class="row"><div><div class="t">${esc(r.item||(r.type==='buy'?'কেনা':'জমা'))}</div><div class="s">${dt} · ${esc(r.byName||'?')}${r.note?' · '+esc(r.note):''}</div><div class="acts"><button class="ab" data-e="${esc(r.id)}">✏ এডিট</button><button class="ab del" data-id="${esc(r.id)}">🗑 মুছুন</button></div></div><div class="amt ${r.type}">${r.type==='buy'?'':'+ '}${tk(r.amount)}<div class="s">${r.type==='buy'?'বাকি':'জমা'}</div></div></div>`;
  });
  $('list').innerHTML=h;
}
$('mf').onchange=e=>{filter=e.target.value;render()};
$('list').onclick=async e=>{
  const eid=e.target.dataset&&e.target.dataset.e;if(eid){openEdit(eid);return}
  const id=e.target.dataset&&e.target.dataset.id;if(!id)return;
  if(!confirm('এই এন্ট্রি মুছে ফেলবেন?'))return;
  try{await col.doc(id).delete()}catch(err){alert('মোছা যায়নি: '+err.message)}
};
$('save').onclick=async()=>{
  const date=$('d').value||today(),note=$('note').value.trim();
  const list=[];
  if(type==='buy'){
    for(const n of items){if(n in sel){const a=parseFloat(sel[n]);if(!(a>0)){alert('"'+n+'" এর দাম লিখুন');return}list.push({item:n,amount:a})}}
    const ex=$('item').value.trim(),ea=parseFloat($('amt').value);
    if(ex||ea>0){
      if(!ex){alert('অন্য জিনিসের নাম লিখুন');return}
      if(!(ea>0)){alert('"'+ex+'" এর দাম লিখুন');return}
      list.push({item:ex,amount:ea});
    }
    if(!list.length){alert('কমপক্ষে একটা জিনিস বেছে তার দাম লিখুন');return}
  }else{
    const a=parseFloat($('amt').value);
    if(!(a>0)){alert('টাকার পরিমাণ লিখুন');return}
    list.push({item:$('item').value.trim(),amount:a});
  }
  const b=$('save');b.disabled=true;
  try{
    const batch=firebase.firestore().batch();
    list.forEach((x,i)=>batch.set(col.doc(),{type,date,item:x.item,amount:x.amount,note,byName:myName,ts:Date.now()+i}));
    await batch.commit();
    sel={};$('item').value='';$('amt').value='';$('note').value='';renderQuick();calcTotal();
  }catch(err){alert('সংরক্ষণ হয়নি: '+err.message)}
  b.disabled=false;
};

async function start(){
  $('d').value=today();
  const code=LS.get('kh_code'),cfgS=LS.get('kh_cfg');
  myName=LS.get('kh_name')||'';
  const cfg=BUILT_IN_CONFIG||(cfgS&&JSON.parse(cfgS));
  if(!code||!cfg||!cfg.apiKey||!myName){showSetup();return}
  $('gear').hidden=false;$('status').hidden=false;
  if(typeof firebase==='undefined'){$('status').textContent='ইন্টারনেট সংযোগ নেই বা Firebase লোড হয়নি। নেট চালু করে আবার খুলুন।';return}
  try{
    firebase.initializeApp(cfg);
    await firebase.auth().signInAnonymously();
    col=firebase.firestore().collection('ledgers').doc(code).collection('entries');
    unsub=col.orderBy('date','desc').onSnapshot(s=>{
      rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
      $('status').hidden=true;$('app').hidden=false;render();
    },e=>{$('status').hidden=false;$('app').hidden=true;$('status').textContent='ডাটা পড়া যায়নি ('+e.code+')। Firestore Rules ও Anonymous সাইন-ইন চালু আছে কিনা দেখুন।'});
  }catch(e){$('status').textContent='চালু করা যায়নি: '+(e.code||e.message)+'। Firebase-এ Anonymous সাইন-ইন চালু করেছেন কিনা দেখুন।'}
}
let editId=null;
function openEdit(id){
  const r=rows.find(x=>x.id===id);if(!r)return;
  editId=id;
  $('eT').textContent=r.type==='buy'?'🛒 কেনা এন্ট্রি সম্পাদনা':'💰 জমা এন্ট্রি সম্পাদনা';
  $('eD').value=r.date||today();$('eI').value=r.item||'';$('eA').value=r.amount;$('eN').value=r.note||'';
  $('ed').hidden=false;
}
$('eC').onclick=()=>{$('ed').hidden=true;editId=null};
$('eS').onclick=async()=>{
  const a=parseFloat($('eA').value);
  if(!(a>0)){alert('টাকার পরিমাণ লিখুন');return}
  const r=rows.find(x=>x.id===editId);
  if(r&&r.type==='buy'&&!$('eI').value.trim()){alert('জিনিসের নাম লিখুন');return}
  $('eS').disabled=true;
  try{
    await col.doc(editId).update({date:$('eD').value||today(),item:$('eI').value.trim(),amount:a,note:$('eN').value.trim()});
    $('ed').hidden=true;editId=null;
  }catch(err){alert('সংরক্ষণ হয়নি: '+err.message)}
  $('eS').disabled=false;
};
$('eX').onclick=async()=>{
  if(!confirm('এই এন্ট্রি মুছে ফেলবেন?'))return;
  try{await col.doc(editId).delete();$('ed').hidden=true;editId=null}catch(err){alert('মোছা যায়নি: '+err.message)}
};

function openReport(){
  const months=[...new Set(rows.map(r=>(r.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  $('rm').innerHTML=months.map(m=>`<option value="${m}">${monthName(m)}</option>`).join('')+'<option value="all">সব এন্ট্রি</option>';
  $('rm').value=(filter!=='all'&&months.includes(filter))?filter:(months[0]||'all');
  $('rep').hidden=false;drawReport();
}
function drawReport(){
  const m=$('rm').value;
  const list=rows.filter(r=>m==='all'||(r.date||'').startsWith(m)).slice()
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
  let open=0;
  if(m!=='all')rows.forEach(r=>{if((r.date||'')<m+'-01')open+=(r.type==='buy'?1:-1)*(+r.amount||0)});
  const buy=list.filter(r=>r.type==='buy').reduce((a,r)=>a+(+r.amount||0),0);
  const pay=list.filter(r=>r.type==='pay').reduce((a,r)=>a+(+r.amount||0),0);
  const title=m==='all'?'সব এন্ট্রি':monthName(m);
  const body=list.length?list.map(r=>`<tr><td>${new Date(r.date).toLocaleDateString('bn-BD',{day:'numeric',month:'short'})}</td><td>${esc(r.item||(r.type==='buy'?'কেনা':'জমা'))}${r.note?'<div class="s">'+esc(r.note)+'</div>':''}</td><td class="n">${r.type==='buy'?tk(r.amount):''}</td><td class="n">${r.type==='pay'?tk(r.amount):''}</td></tr>`).join(''):'<tr><td colspan="4" class="s">এই সময়ে কোনো এন্ট্রি নেই</td></tr>';
  $('repBody').innerHTML=`<h2>📒 বাকির খাতা — রিপোর্ট</h2>
  <div class="s">${esc(title)} · তৈরির তারিখ: ${new Date().toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'})}${myName?' · '+esc(myName):''}</div>
  <table class="rt"><thead><tr><th>তারিখ</th><th>বিবরণ</th><th class="n">কেনা</th><th class="n">জমা</th></tr></thead><tbody>${body}</tbody>
  <tfoot><tr><td colspan="2">মোট</td><td class="n">${tk(buy)}</td><td class="n">${tk(pay)}</td></tr></tfoot></table>
  <div class="rsum">${m!=='all'?`<div><span>পূর্বের বাকি</span><b>${tk(open)}</b></div>`:''}
  <div><span>${m==='all'?'মোট কেনা':'এ মাসে কেনা'}</span><b>${tk(buy)}</b></div>
  <div><span>${m==='all'?'মোট জমা':'এ মাসে জমা'}</span><b>${tk(pay)}</b></div>
  <div class="fin"><span>${m==='all'?'মোট বাকি':'মাস শেষে মোট বাকি'}</span><span>${tk(open+buy-pay)}</span></div></div>`;
}
$('repBtn').onclick=openReport;
$('rm').onchange=drawReport;
$('rClose').onclick=()=>{$('rep').hidden=true};
$('rPrint').onclick=()=>window.print();

renderQuick();setType('buy');
start();
</script>
</body>
</html>
